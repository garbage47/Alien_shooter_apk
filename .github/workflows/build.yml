name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          pip install buildozer "cython<3" virtualenv setuptools
          unzip -o -q Alien_Shooter_apk_project.zip -d app
          cd app
          sed -i 's/warn_on_root = 1/warn_on_root = 0/' buildozer.spec
          buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: alien-shooter-apk
          path: app/bin/*.apk
